syntax = "proto3";

message NumpyList {
    string name = 1;
    repeated NumpyData  np_arrays = 2;
}

message NumpyData {
    string              name = 1;
    string              dtype = 2;
    bytes               array_data = 3;
    repeated int32      shape = 4;
}

message InferenceReq {
    string      model_name =1;
    NumpyList   data = 2;
}

message InferenceRsp {
    string      model_name = 1;
    int32       err_code = 2;
    string      err_msg = 3;
    NumpyList       data = 4;
}

message UpdateWeightReq {
    string      model_name = 1;
    bytes       weight = 2;
    string      extra_msg = 3;
}

message UpdateWeightRsp {
    string      model_name = 1;
    bytes       weight = 2;
    int32       err_code = 3;
    string      err_msg = 4;
}

// 定义一个服务和两个接口
service PredictorService {
    rpc Inference(InferenceReq) returns (InferenceRsp);
    // rpc LogProbs(InferenceReq) returns (InferenceRsp);
    // rpc AsyncInference(InferenceReq) returns (InferenceRsp);
    rpc UpdateWeight(UpdateWeightReq) returns (UpdateWeightRsp);
}